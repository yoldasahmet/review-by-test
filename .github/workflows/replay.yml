name: Replay benchmark
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m unittest
      - run: python replay.py
      - run: python experiment.py replay
      - run: python review_experiment.py replay
      - run: python review_tuning_experiment.py replay
      - run: python review_prover_experiment.py replay
